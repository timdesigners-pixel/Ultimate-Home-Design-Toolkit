name: Sürüm yayını (Windows)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Etiket ve uygulama sürümü aynı mı
        if: github.ref_type == 'tag'
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Etiket $GITHUB_REF_NAME, uygulama sürümü $v"; exit 1; }
      - name: Rust motor testleri
        run: cargo test -p uhd-engine --release
      - name: Çeviri denetimi (tr/en)
        run: node scripts/i18n-check.cjs
  windows:
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Bağımlılıklar
        run: npm ci
      - name: Tauri Windows derlemesi (NSIS kurulum)
        run: npx tauri build
      - name: Kurulum, taşınabilir paket, SHA256SUMS ve BUILD-INFO
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "TAG=v$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force dist, portable/cycles | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_.FullName "dist/UltimateHome-$v-Windows-Setup-x64.exe" }
          Copy-Item "src-tauri/target/release/ultimate-home.exe" "portable/UltimateHome.exe"
          Copy-Item "cycles/uhd_cycles.py" "portable/cycles/uhd_cycles.py"
          Compress-Archive -Path portable/* -DestinationPath "dist/UltimateHome-$v-Windows-Portable-x64.zip"
          $sums = Get-ChildItem dist/*.exe, dist/*.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          @{ product = "Ultimate Home Design Toolkit"; id = "PL-060"; version = $v; tag = "v$v"; commit = "${{ github.sha }}"; runner = "windows-latest"; signed = $false; built = (Get-Date -Format o) } | ConvertTo-Json | Set-Content dist/BUILD-INFO.json
          Get-Content dist/SHA256SUMS.txt
      - name: GitHub sürümü
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Ultimate Home Design Toolkit ${{ env.TAG }}
          body_path: RELEASE-NOTES.md
          prerelease: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json
  android:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: İmza anahtarı tanımlı mı
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "ANDROID_KEYSTORE_B64 ve ANDROID_KEYSTORE_PASSWORD depo sırları tanımlı değil; imzasız APK yayımlanmaz."; exit 1; }
      - name: Android hedefleri
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Bağımlılıklar
        run: npm ci
      - name: APK derlemesi (telefon ve tablet)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - name: İmzala, SHA256SUMS
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/uh.jks"
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/uh.jks" --ks-key-alias ultimatehome --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "dist/UltimateHome-$v-Android.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/uh.jks"
          "$bt/apksigner" verify "dist/UltimateHome-$v-Android.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS-android.txt)
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - name: GitHub sürümüne ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            dist/*.apk
            dist/SHA256SUMS-android.txt
